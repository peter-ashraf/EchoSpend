<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 100" fill="none">
  <g flex items-center>
    <!-- CIB Blue monogram C -->
    <path d="M 45 20 A 30 30 0 1 0 45 80 L 55 80 A 40 40 0 1 1 55 20 Z" fill="#002d62"/>
    <!-- Orange Core Globe in C -->
    <circle cx="35" cy="50" r="14" fill="#f97316"/>
    <circle cx="35" cy="50" r="8" stroke="#ffffff" stroke-width="3" fill="none"/>
    <!-- IB Letters -->
    <text x="75" y="70" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="56" fill="#ffffff" letter-spacing="-2">IB</text>
    <!-- Commercial International Bank subtitle -->
    <text x="160" y="48" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="16" fill="#ffffff">Commercial</text>
    <text x="160" y="68" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="16" fill="#f97316">International Bank</text>
  </g>
</svg>